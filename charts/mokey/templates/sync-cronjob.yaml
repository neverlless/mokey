{{- if .Values.sync.cronjob.enabled }}
{{- if and .Values.ipa.enroll (not .Values.existingKeytabSecret) }}
{{- fail "sync.cronjob.enabled needs existingKeytabSecret: the CronJob does not enroll, and enrolling per job would rotate the keytab" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "mokey.fullname" . }}-sync
  labels:
    {{- include "mokey.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.sync.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "mokey.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: sync
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["mokey", "sync", "--config=/etc/mokey/mokey.toml"]
              {{- with .Values.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.extraEnv }}
              env:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: config
                  mountPath: /etc/mokey/mokey.toml
                  subPath: mokey.toml
                {{- if .Values.existingKeytabSecret }}
                - name: keytab
                  mountPath: /etc/mokey/private
                  readOnly: true
                {{- end }}
              {{- $res := .Values.sync.cronjob.resources | default .Values.resources }}
              {{- with $res }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          volumes:
            - name: config
              secret:
                secretName: {{ .Values.existingConfigSecret | default (printf "%s-config" (include "mokey.fullname" .)) }}
            {{- if .Values.existingKeytabSecret }}
            - name: keytab
              secret:
                secretName: {{ .Values.existingKeytabSecret }}
            {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
