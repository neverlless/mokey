{{ if $.subid_enabled }}
<div id="subid-card">
	<h2 class="mokey-section-title mb-2">{{ T "subid.title" }}</h2>
	{{ if $.subid }}
	<dl class="mokey-card mokey-facts mb-4">
		<div class="mokey-row">
			<dt>{{ T "subid.subuid_start" }}</dt>
			<dd id="subuid-start" class="mokey-mono">{{ .subid.SubUID }}</dd>
		</div>
		<div class="mokey-row">
			<dt>{{ T "subid.subgid_start" }}</dt>
			<dd id="subgid-start" class="mokey-mono">{{ .subid.SubGID }}</dd>
		</div>
		<div class="mokey-row">
			<dt>{{ T "subid.count" }}</dt>
			<dd id="subid-count" class="mokey-mono">{{ .subid.Count }}</dd>
		</div>
	</dl>
	{{ else }}
	<div class="mokey-card mb-4">
		<div class="mokey-row">
			<div class="flex-grow-1 text-muted">{{ T "subid.description" }}</div>
			<button class="btn btn-sm btn-outline-secondary" hx-post="/subid/generate"
			        hx-headers='{"X-CSRF-Token": "{{ $.csrf }}"}'
			        hx-target="#subid-card" hx-swap="outerHTML">
				{{ T "subid.generate" }}
			</button>
		</div>
	</div>
	{{ end }}
</div>
{{ end }}
