<div id="modal-backdrop" class="modal-backdrop fade show" style="display:block;"></div>
<div id="modal" class="modal fade show" tabindex="-1" style="display:block;" role="dialog" aria-modal="true" aria-labelledby="modalLabel">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form>
        <div class="modal-header">
           <h2 class="modal-title mokey-section-title" id="modalLabel">{{ T "otptoken.add_new_title" }}</h2>
        </div>
        <div id="modal-body" class="modal-body">
            <div id="add-token-failed" style="display: none" class="alert alert-danger alert-dismissible mx-auto" role="alert">
            </div>
            <ol class="mokey-numbered">
                <li><div>
                    <strong>{{ T "otptoken.step_install_title" }}</strong>
                    <div class="text-muted">{{ T "otptoken.step_install_body" }}</div>
                    <div class="mt-3">
                        <label for="desc" class="form-label">{{ T "otptoken.token_description_label" }}</label>
                        <input id="desc" type="text" class="form-control" name="desc" value="" autofocus="autofocus" placeholder="{{ T "otptoken.token_description_placeholder" }}" aria-describedby="tokenHelpBlock">
                        <div id="tokenHelpBlock" class="form-text">{{ T "otptoken.token_description_hint" }}</div>
                    </div>
                </div></li>
                <li><div class="text-muted">{{ T "otptoken.step_scan_title" }}</div></li>
                <li><div class="text-muted">{{ T "otptoken.step_code_title" }}</div></li>
            </ol>
        </div>
        <div class="modal-footer">
          <div id="add-indicator" class="htmx-indicator spinner-border spinner-border-sm text-primary" role="status">
              <span class="visually-hidden">{{ T "otptoken.adding_token" }}</span>
          </div>
          <button type="button" class="btn btn-outline-secondary" _="on click call closeModal('otptoken-modal')">{{ T "common.cancel" }}</button>
          <button 
            hx-headers='{"X-CSRF-Token": "{{ $.csrf }}"}'
            hx-target-error="add-token-failed"
            hx-post="/otptoken/add"
            hx-target="#modal"
            hx-indicator="#add-indicator"
            hx-swap="innerHTML"
            class="btn btn-primary"
            type="submit">
          {{ T "otptoken.continue" }}
          </button>
        </div>

        </form>
      </div>
    </div>
  </div>
