{{ template "header.html" . }}
<main class="mokey-error">
  <div class="mokey-card mokey-card-body text-center">
    <span class="mokey-tile is-warn mb-3" aria-hidden="true"><i class="fa fa-triangle-exclamation"></i></span>
    <h1 class="mb-2">{{ T "error.something_bad_happened" }}</h1>
    <p class="text-muted mb-4">{{ T "error.system_trouble" }}</p>
    <a class="btn btn-primary" href="/">{{ T "error.go_home" }}</a>
  </div>
</main>
{{ template "footer.html" . }}
