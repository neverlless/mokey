<!DOCTYPE html>
<html lang="{{ LanguageCode }}">
<head>
	<meta charset="UTF-8">
	<script nonce="{{ $.cspNonce }}">
		// set the theme before first paint to avoid a flash; mirrors site.js's toggle
		(function () {
			var t = localStorage.getItem("mokey-theme");
			if (!t) { t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
			document.documentElement.setAttribute("data-bs-theme", t);
		})();
	</script>
	<title>{{ ConfigValueString "site.name" }} - {{ T "common.identity_management" }}</title>
	<meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
    <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png"/>
    <link rel="shortcut icon" href="/favicon.ico">
    <link href="/static/css/bootstrap.min.css?v=20260818b" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="/static/css/fontawesome.all.min.css?v=20260818b" integrity="sha384-3B6NwesSXE7YJlcLI9RpRqGf2p/EgVH8BgoKTaUrmKNDkHPStTQ3EyoYjCGXaOTS" crossorigin="anonymous">
	<link rel="stylesheet" href="/static/css/sweetalert2.min.css?v=20260818b" integrity="sha384-SUNIgQeCps0CoAVRrheRnQztaghCAffXsWBNCCUvia+XNEh7IZg6RvTKpovgqBrc" crossorigin="anonymous">
	<link rel="stylesheet" type="text/css" href="/static/css/fonts.css?v=20261106a" integrity="sha384-ZGWlLlzR3qAp+srbI99v11uIhmpDNTMYogWOLymaDRV2RGTnO3LujvyObjNjtIaD" crossorigin="anonymous">
	<link rel="stylesheet" type="text/css" href="/static/css/style.css?v=20261106e" integrity="sha384-NiKD/heti2Gsjn6MbC+O9VuHfRzNRnhJW++kmxwnY2YNHeTQf3cRaQcVxJ07rMTZ" crossorigin="anonymous">
    {{ with ConfigValueString "site.css" }}
	<link rel="stylesheet" type="text/css" href="/css/styles">
    {{ end }}
</head>
<body>
    {{ if not $.shell }}
    <nav class="navbar navbar-inverse navbar-fixed-top">
      <div class="container d-flex align-items-center">
        <div class="navbar-header">
          <a class="navbar-brand" href="/">{{ with ConfigValueString "site.logo" }}<img id="site-logo" src="/images/logo" alt="{{ ConfigValueString "site.name" }}" />{{ else }}{{ ConfigValueString "site.name" }}{{ end }}</a>
        </div>
      </div>
    </nav>
    {{ end }}
