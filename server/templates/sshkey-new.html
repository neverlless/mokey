<div id="modal-backdrop" class="modal-backdrop fade show" style="display:block;"></div>
<div id="modal" class="modal fade show" tabindex="-1" style="display:block;">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form>
        <div class="modal-header">
           <h5 class="modal-title" id="modalLabel"><i class="fa fa-key"></i> {{ T "sshkey_new.add_title" }}</h5>
        </div>
        <div id="modal-body" class="modal-body">
            <div id="add-key-failed" style="display: none" class="alert alert-danger alert-dismissible mx-auto" role="alert">
            </div>
            <div class="mb-3">
                <label class="form-label">{{ T "sshkey_new.title_label" }}</label>
                <input type="text" class="form-control" name="title" id="title" value="">
            </div>
            <div class="mb-3">
              <label for="key" class="form-label">{{ T "sshkey_new.public_key" }}</label>
              <textarea class="form-control" id="key" name="key" rows="5" aria-describedby="keyHelp"></textarea>
              <div id="keyHelp" class="form-text">{{ T "sshkey_new.key_help" }}</div>
            </div>
        </div>
        <div class="modal-footer">
          <div id="add-indicator" class="htmx-indicator spinner-border text-primary" role="status">
              <span class="visually-hidden">{{ T "sshkey_new.adding" }}</span>
          </div>
          <button 
            hx-headers='{"X-CSRF-Token": "{{ $.csrf }}"}'
            hx-post="/sshkey/add"
            hx-target-error="add-key-failed"
            hx-target="#sshkey"
            hx-indicator="#add-indicator"
            hx-swap="innerHTML"
            class="btn btn-primary"
            type="submit">
          {{ T "common.add" }}
          </button>
          <button type="button" class="btn btn-secondary" _="on click call closeModal('sshkey-modal')">{{ T "common.cancel" }}</button>
        </div>

        </form>
      </div>
    </div>
  </div>
