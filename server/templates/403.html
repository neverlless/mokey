{{ template "header.html" . }}
<main class="mokey-error">
  <div class="mokey-card mokey-card-body text-center">
    <span class="mokey-tile is-warn mb-3" aria-hidden="true"><i class="fa fa-clock"></i></span>
    <h1 class="mb-2">{{ T "error.session_title" }}</h1>
    <p class="text-muted mb-4">{{ T "error.session_timed_out" }}</p>
    <a class="btn btn-primary" href="/auth/login">{{ T "error.sign_in" }}</a>
  </div>
</main>
{{ template "footer.html" . }}
