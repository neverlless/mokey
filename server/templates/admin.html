<h1 class="mb-1">{{ T "admin.requests_title" }}</h1>
<p class="text-muted mb-4">{{ T "admin.requests_body" }}</p>

{{ if ConfigValueBool "accounts.require_admin_verify" }}
<h2 class="mokey-section-title mb-2">{{ T "admin.pending_title" }}</h2>
<div class="mokey-card p-3 mb-4">
  <div id="admin-pending" hx-get="/admin/pending" hx-trigger="load"
       hx-headers='{"X-CSRF-Token": "{{ $.csrf }}"}'></div>
</div>
{{ end }}

<h2 class="mokey-section-title mb-2">{{ T "admin.otprecovery_title" }}</h2>
<div class="mokey-card p-3 mb-4">
  <div id="admin-otprecovery" hx-get="/admin/otprecovery" hx-trigger="load"
       hx-headers='{"X-CSRF-Token": "{{ $.csrf }}"}'></div>
</div>

<h2 class="mokey-section-title mb-2">{{ T "admin.helpdesk_title" }}</h2>
<div class="mokey-card p-3">
  <div id="admin-helpdesk" hx-get="/admin/helpdesk" hx-trigger="load"
       hx-headers='{"X-CSRF-Token": "{{ $.csrf }}"}'></div>
</div>
