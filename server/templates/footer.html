
<div class="container">
  <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
    <p class="col-md-4 mb-0 text-muted">
        {{ with ConfigValueString "site.homepage" }}
            <a href="{{ . }}">{{ ConfigValueString "site.name" }}</a>
        {{ else }}
            {{ T "common.powered_by" }} <a href="https://github.com/neverlless/mokey"><i class="fa-brands fa-github" aria-hidden="true"></i> mokey</a>
        {{ end }}
    </p>

    <ul class="nav col-md-4 justify-content-end list-unstyled d-flex align-items-center">
      <li class="ms-3">
        <button type="button" class="theme-toggle" id="theme-toggle"
                aria-label="{{ T "common.toggle_theme" }}" title="{{ T "common.toggle_theme" }}">
          <i class="fa fa-circle-half-stroke fa-lg" aria-hidden="true"></i>
        </button>
      </li>
      {{ with ConfigValueString "site.help_url" }}
      <li class="ms-3"><a class="text-muted" href="{{ . }}" aria-label="{{ T "common.help" }}" title="{{ T "common.help" }}"><i class="fa fa-circle-question fa-lg"></i></a></li>
      {{ end }}
    </ul>
  </footer>
</div>

<script src="/static/js/sweetalert2.min.js?v=20260818b" integrity="sha384-MFQHLECN7JsqezT2nLwWieqtG6G9yQWxkJh31QjDyO2dhpkHSo6vQYGDcjMVgDlc" crossorigin="anonymous"></script>
<script src="/static/js/htmx.min.js?v=20260818b" integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq" crossorigin="anonymous"></script>
<script src="/static/js/hyperscript.min.js?v=20260818b" integrity="sha384-5yQ5JTatiFEgeiEB4mfkRI3oTGtaNpbJGdcciZ4IEYFpLGt8yDsGAd7tKiMwnX9b" crossorigin="anonymous"></script>
<script src="/static/js/bootstrap.bundle.min.js?v=20260818b" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="/static/js/site.js?v=20260908i"></script>
</body>
</html>
