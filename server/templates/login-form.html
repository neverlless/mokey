<div class="login-card rounded-3 bg-white mx-auto">
    <div class="login-body">
        <div class="login-body-wrapper mx-auto">
            <h2 class="login-step">{{ if $.user.OTPOnly }}{{ T "login.otp_authentication" }}{{ else }}{{ T "common.password" }}{{ end }}</h2>
            <form>
            <div class="mb-3">
                <label for="username" class="form-label">{{ T "common.username" }}</label>
                <input id="username" type="text" autocomplete="username" class="form-control form-control-lg" value="{{ $.user.Username }}" disabled="disabled">
                <div id="usernameHelpBlock" class="form-text">
                 {{ T "login.not_you" }} <a href="/auth/login">{{ T "login.switch_account" }}</a>
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">{{ T "common.password" }}</label>
                <input type="password" class="form-control form-control-lg" name="password" id="password" autocomplete="current-password" autofocus="autofocus" placeholder="">
            </div>
            {{ if $.user.OTPOnly }}
            <div class="mb-3">
                <label for="otp" class="form-label">{{ T "common.otp_code" }}</label>
                <input type="text" class="form-control form-control-lg" name="otp" id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="">
            </div>
            {{ end }}
            <div class="mb-3 d-grid gap-2">
              <input type="hidden" name="challenge" value="{{ $.challenge }}" />
              <input type="hidden" name="username" value="{{ $.user.Username }}" />
              <button hx-headers='{"X-CSRF-Token": "{{ $.csrf }}"}' hx-target-error="login-failed" hx-post="/auth/authenticate" hx-target="#login" hx-swap="innerHTML" class="btn btn-primary btn-lg" type="submit">
              <span class="htmx-indicator spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 
              {{ T "common.login" }}
              </button>
            </div>
          </form>
            <p class="login-links text-muted text-center mb-0"><a href="/auth/forgotpw">{{ T "login.forgot_password" }}</a> &middot; <a href="/auth/forgotuser">{{ T "login.forgot_username" }}</a></p>
        </div>
    </div>
</div>
