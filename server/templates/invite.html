{{ template "header.html" . }}
<section class="main-content">
        <div id="login-failed" style="display: none" class="login-failed alert alert-danger mx-auto" role="alert">
        </div>
        <div id="login" class="container">
            <div class="login-card rounded-3 overflow-hidden bg-white mx-auto">
                <div class="login-head bg-dark text-light p-4">
                    <h3 class="text-center m-0">{{ T "invite.title" }}</h3>
                </div>
                <div class="login-body p-4 p-md-5">
                    <div class="login-body-wrapper mx-auto">
                        <p class="text-center text-muted">{{ T "invite.intro" }} <strong>{{ $.claims.Email }}</strong></p>
                        <form>
                        {{ if not $.usernameFromEmail }}
                        <div class="mb-3">
                            <label for="username" class="form-label">{{ T "common.username" }}</label>
                            <input type="text" class="form-control form-control-lg" name="username" id="username" autofocus="autofocus" placeholder="">
                        </div>
                        {{ end }}
                        <div class="mb-3">
                            <label for="first" class="form-label">{{ T "common.first_name" }}</label>
                            <input type="text" class="form-control form-control-lg" name="first" id="first" placeholder="">
                        </div>
                        <div class="mb-3">
                            <label for="last" class="form-label">{{ T "common.last_name" }}</label>
                            <input type="text" class="form-control form-control-lg" name="last" id="last" placeholder="">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">{{ T "common.password" }}</label>
                            <input type="password" class="form-control form-control-lg" name="password" id="password" placeholder="">
                        </div>
                        <div class="mb-3">
                            <label for="password2" class="form-label">{{ T "common.confirm_password" }}</label>
                            <input type="password" class="form-control form-control-lg" name="password2" id="password2" placeholder="">
                        </div>
                        <div class="mb-3 d-grid gap-2">
                          <button hx-headers='{"X-CSRF-Token": "{{ $.csrf }}"}' hx-target-error="login-failed" hx-post hx-target="#login" hx-swap="innerHTML" class="btn btn-primary btn-lg" type="submit">
                          <span class="htmx-indicator spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                          {{ T "invite.create_button" }}
                          </button>
                        </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </section>
{{ template "footer.html" . }}
