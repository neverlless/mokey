<div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
  <div class="modal-content">
    <form>
    <div class="modal-header">
       <h2 class="modal-title mokey-section-title" id="modalLabel">{{ T "otptoken.add_new_title" }}</h2>
    </div>
    <div id="modal-body" class="modal-body">
        <div id="verify-token-failed" style="display: none" class="alert alert-danger alert-dismissible mx-auto" role="alert">
        </div>
        <ol class="mokey-numbered">
            <li class="is-done"><div class="text-muted">{{ T "otptoken.step_install_title" }}</div></li>
            <li><div>
                <strong>{{ T "otptoken.step_scan_title" }}</strong>
                <img class="mokey-qr" alt="{{ T "otptoken.qr_code_alt" }}" src="data:image/png;base64,{{ .otpdata }}" />
                <a class="small" data-bs-toggle="collapse" href="#showURI" role="button" aria-expanded="false" aria-controls="showURI">{{ T "otptoken.cant_scan" }}</a>
                <div class="collapse" id="showURI">
                  <div class="mt-2 p-2 rounded border small mokey-mono text-break">{{ .otptoken.URI }}</div>
                </div>
            </div></li>
            <li><div>
                <label for="otpcode" class="form-label fw-semibold">{{ T "otptoken.step_code_title" }}</label>
                <input id="otpcode" type="text" class="form-control" name="otpcode" value="" inputmode="numeric" autocomplete="one-time-code" autofocus="autofocus">
                <input type="hidden" name="uuid" value="{{ $.otptoken.UUID }}" />
                <input type="hidden" name="uri" value="{{ $.otptoken.URI }}" />
            </div></li>
        </ol>
    </div>
    <div class="modal-footer">
      <div id="verify-indicator" class="htmx-indicator spinner-border spinner-border-sm text-primary" role="status">
          <span class="visually-hidden">{{ T "otptoken.verifying_token" }}</span>
      </div>
      <button 
        hx-headers='{"X-CSRF-Token": "{{ $.csrf }}"}'
        hx-target-error="verify-token-failed"
        hx-post="/otptoken/verify"
        hx-vals='{"action": "cancel"}'
        hx-target="#otp"
        hx-indicator="#verify-indicator"
        hx-swap="innerHTML"
        class="btn btn-outline-secondary"
        type="button">
      {{ T "common.cancel" }}
      </button>
      <button 
        hx-headers='{"X-CSRF-Token": "{{ $.csrf }}"}'
        hx-target-error="verify-token-failed"
        hx-post="/otptoken/verify"
        hx-target="#otp"
        hx-indicator="#verify-indicator"
        hx-swap="innerHTML"
        class="btn btn-primary"
        type="submit">
      {{ T "common.verify" }}
      </button>
    </div>
    </form>
  </div>
</div>
