<div class="login-card rounded-3 overflow-hidden bg-white mx-auto">
    <div class="login-head bg-dark text-light p-4">
        <h3 class="text-center m-0">{{ T "verify_success.title" }}</h3>
    </div>
    <div class="login-body p-4 p-md-5">
        <div class="login-body-wrapper mx-auto">
            <div class="text-center">
            {{ if $.pending_admin }}
            <div class="alert alert-warning d-flex gap-2 text-start" role="alert">
              <i class="fa-regular fa-clock lh-base" aria-hidden="true"></i>
              <div>{{ T "verify_success.pending_admin" }}</div>
            </div>
            <p>{{ T "verify_success.pending_admin_help" }}</p>
            {{ else }}
            <div class="alert alert-success d-flex gap-2 text-start" role="alert">
              <i class="fa-regular fa-circle-check lh-base" aria-hidden="true"></i>
              <div>{{ T "verify_success.message" }}</div>
            </div>
            <div class="d-grid gap-2 mt-3">
              <a href="/auth/login" class="btn btn-primary">{{ T "common.login" }}</a>
            </div>
            {{ end }}
            </div>
        </div>
    </div>
</div>
