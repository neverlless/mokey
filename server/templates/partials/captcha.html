{{ with $.captchaID }}
<div class="mb-3">
    <label for="captcha_sol" class="form-label">{{ T "common.captcha" }}</label>
    <div class="mokey-captcha">
        <img id="captcha" src="/auth/captcha/{{ . }}.png" alt="{{ T "common.captcha_image" }}">
        <button type="button" class="btn btn-sm btn-link mokey-captcha-new" _="on click call reloadCaptcha()"><i class="fa fa-rotate-right" aria-hidden="true"></i> {{ T "common.captcha_new" }}</button>
    </div>
    <input id="captcha_sol" name="captcha_sol" class="form-control form-control-lg mt-2" size="10" type="text" inputmode="numeric" autocomplete="off">
    <input id="captcha_id" name="captcha_id" type="hidden" value="{{ . }}">
</div>
{{ end }}
