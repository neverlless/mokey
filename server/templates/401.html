{{ template "header.html" . }}
<main class="mokey-error">
  <div class="mokey-card mokey-card-body text-center">
    <span class="mokey-tile is-warn mb-3" aria-hidden="true"><i class="fa fa-lock"></i></span>
    <h1 class="mb-2">{{ T "error.access_denied" }}</h1>
    <p class="text-muted mb-4">{{ T "error.no_access_to_resource" }}</p>
    <a class="btn btn-primary" href="/">{{ T "error.go_home" }}</a>
  </div>
</main>
{{ template "footer.html" . }}
