site_name: mokey
site_description: Self-service account management portal for FreeIPA / Red Hat IdM
site_url: https://neverlless.github.io/mokey/
repo_url: https://github.com/neverlless/mokey
repo_name: neverlless/mokey
edit_uri: edit/main/docs/
docs_dir: docs

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

exclude_docs: |
  superpowers/
  requirements.txt
  *.asc

theme:
  name: material
  favicon: assets/favicon.svg
  icon:
    logo: material/shield-account
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Install: install.md
  - Guides:
      - Self-service password reset: guides/password-reset.md
      - User signup and approval: guides/signup.md
      - OTP tokens: guides/otp.md
      - Passkeys: guides/passkeys.md
      - OIDC / SSO with Ory Hydra: guides/oidc-hydra.md
      - Group self-service: guides/groups.md
      - Access page (HBAC and sudo): guides/access.md
      - App catalog: guides/app-catalog.md
      - Webhooks and JSON API: guides/webhooks-api.md
      - Admin helpdesk view: guides/helpdesk.md
  - Companion mode:
      - Next to any OIDC provider: companion/oidc-provider.md
      - Next to Keycloak (SAML broker): keycloak.md
  - Comparisons: comparison.md
  - Reference:
      - Configuration: configuration.md
      - Hydra v1 to v2 migration: hydra-v2-migration.md
  - Project:
      - Roadmap: ROADMAP.md
      - Security audit (v1.6): security-audit-v1.6.md
