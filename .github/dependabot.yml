version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/examples/mokey-oidc"]
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
