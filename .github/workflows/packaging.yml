name: Packaging

on:
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - "packaging/**"
      - ".copr/**"
      - "scripts/nfpm/**"
      - ".github/workflows/packaging.yml"
  pull_request:
    paths:
      - "ansible/**"
      - "packaging/**"
      - ".copr/**"
      - "scripts/nfpm/**"
      - ".github/workflows/packaging.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ansible-core 2.22 needs Python 3.13; the runner ships 3.12
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Lint the role
        working-directory: ansible
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q ansible-core==2.22.0 ansible-lint==26.11.0
          /tmp/venv/bin/ansible-galaxy collection install -r requirements.yml
          PATH=/tmp/venv/bin:$PATH ansible-lint --offline

  rpm:
    name: RPM (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - fedora:43
          - quay.io/rockylinux/rockylinux:8
          - quay.io/rockylinux/rockylinux:9
          - quay.io/almalinuxorg/almalinux:10
    container: ${{ matrix.image }}
    steps:
      # before checkout, so it clones with git and keeps the tags for the version
      - name: Install build tools
        run: dnf -y install git make golang rpm-build dnf-plugins-core systemd

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build the SRPM
        run: make -f .copr/Makefile srpm outdir="$PWD/dist/srpm"

      - name: Build the RPM
        run: |
          dnf -y builddep dist/srpm/*.src.rpm
          rpmbuild --rebuild --define "_rpmdir $PWD/dist/rpm" dist/srpm/*.src.rpm

      - name: Install and check
        run: |
          dnf -y install dist/rpm/*/mokey-[0-9]*.rpm
          mokey --version | grep -v ' dev$'
          systemd-analyze verify /usr/lib/systemd/system/mokey.service
          test "$(stat -c %U:%G /var/lib/mokey)" = mokey:mokey
          test "$(stat -c %G /etc/mokey/private)" = mokey
