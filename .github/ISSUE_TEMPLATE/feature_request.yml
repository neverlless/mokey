name: Feature request
description: Suggest an idea for mokey
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you or your users trying to do, and what stops you today?
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, FreeIPA settings or workarounds you looked at.
